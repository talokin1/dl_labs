[project]
name = "lab2"
version = "0.1.0"
description = "ЛР2. Поріг рішення під асиметричну ціну помилок"
requires-python = "==3.12.*"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==1.26.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "torch==2.2.2",
]

[tool.uv]
package = false
# Lock-файл перевіряється на наявність коліс для всіх цих платформ.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# CPU-збірка torch для Linux і Windows; на macOS PyPI-колеса torch і так лише CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
